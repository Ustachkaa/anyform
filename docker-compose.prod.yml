# Production overrides for a single VPS.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Adds Caddy (TLS termination), stops publishing api/web/db ports to the host,
# and runs two worker replicas.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

  db:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

  api:
    ports: !reset []
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://anyform:${POSTGRES_PASSWORD}@db:5432/anyform

  worker:
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "4"
          memory: 6g
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://anyform:${POSTGRES_PASSWORD}@db:5432/anyform

  web:
    ports: !reset []
    environment:
      NODE_ENV: production

volumes:
  caddy_data:
  caddy_config:
